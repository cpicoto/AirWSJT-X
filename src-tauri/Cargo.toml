[package]
name = "airwsjtx"
version = "0.3.4"
description = "AirWSJT-X — AirScatter Ham radio supervisor"
authors = ["AirWSJT-X contributors"]
edition = "2021"

[lib]
name = "airwsjtx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
