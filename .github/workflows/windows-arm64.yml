name: Windows ARM64 setup

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - ".github/workflows/release.yml"
      - "airwsjtx/**"
      - "sidecar/**"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "tests/test_windows_packaging.py"
      - "tests/test_sidecar_packaging.py"
      - "package*.json"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    name: Native Windows ARM64 installer
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          architecture: arm64

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-aarch64-pc-windows-msvc
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify native build tools
        run: |
          python -c "import sys; from pathlib import Path; from scripts.verify_windows_arm64 import require_arm64; require_arm64(Path(sys.executable))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "if (process.arch !== 'arm64') throw new Error('ARM64 Node.js is required')"

      - name: Run Python tests on ARM64
        run: python -m unittest discover -s tests -v

      - name: Sync release version
        if: inputs.release_tag != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: python scripts\sync_release_version.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle native Python sidecar
        run: |
          python -m pip install pyinstaller certifi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --distpath src-tauri\binaries sidecar\airwsjtx_bridge.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item src-tauri\binaries\airwsjtx_bridge\airwsjtx_bridge.exe src-tauri\binaries\airwsjtx_bridge-aarch64-pc-windows-msvc.exe
          Move-Item src-tauri\binaries\airwsjtx_bridge\airwsjtx_bridge-runtime src-tauri\binaries\airwsjtx_bridge-runtime

      - name: Verify Windows runtime packaging
        env:
          AIRWSJTX_PACKAGED_SIDECAR: src-tauri/binaries/airwsjtx_bridge-aarch64-pc-windows-msvc.exe
        run: python -m unittest tests.test_sidecar_packaging -v

      - name: Build ARM64 NSIS setup
        run: npx tauri build --ci --target aarch64-pc-windows-msvc --config src-tauri\tauri.desktop.conf.json --config src-tauri\tauri.windows-desktop.conf.json --config src-tauri\tauri.windows-arm64.conf.json

      - name: Verify native executables and packaged sidecar protocol
        run: python scripts\verify_windows_arm64.py --app src-tauri\target\aarch64-pc-windows-msvc\release\airwsjtx.exe --sidecar src-tauri\target\aarch64-pc-windows-msvc\release\airwsjtx_bridge.exe

      - name: Upload Windows ARM64 setup
        uses: actions/upload-artifact@v7
        with:
          name: AirWSJT-X-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*_arm64-setup.exe
          if-no-files-found: error
