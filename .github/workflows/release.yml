name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: python-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_name: airwsjtx_bridge-aarch64-apple-darwin
            pyinstaller_name: airwsjtx_bridge
            bundles: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: airwsjtx_bridge-x86_64-pc-windows-msvc.exe
            pyinstaller_name: airwsjtx_bridge.exe
            bundles: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar_name: airwsjtx_bridge-x86_64-unknown-linux-gnu
            pyinstaller_name: airwsjtx_bridge
            bundles: "appimage,deb,rpm"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/sync_release_version.py

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            rpm

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle Python sidecar with PyInstaller
        run: |
          pip install pyinstaller certifi
          pyinstaller --onefile --name airwsjtx_bridge --distpath src-tauri/binaries --paths . sidecar/airwsjtx_bridge.py

      - name: Rename sidecar binary for Tauri target triple
        shell: bash
        run: |
          cd src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv airwsjtx_bridge.exe "${{ matrix.sidecar_name }}"
          else
            mv airwsjtx_bridge "${{ matrix.sidecar_name }}"
            chmod +x "${{ matrix.sidecar_name }}"
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign sidecar with entitlements
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime \
            --entitlements src-tauri/Entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/binaries/${{ matrix.sidecar_name }}"
          codesign -dv --verbose=2 "src-tauri/binaries/${{ matrix.sidecar_name }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AirWSJT-X ${{ github.ref_name }}"
          releaseBody: |
            ## AirWSJT-X ${{ github.ref_name }}

            ### What's New in this release
            - **Mobile app** (iOS & Android) — standalone aircraft tracking with OpenSky Network
            - Mobile compass rose and elevation arc for hand-pointing antennas
            - Offline callsign database with IndexedDB on mobile
            - Speech callouts for selected aircraft Az/El on mobile
            - Platform detection: desktop launches full WSJT-X supervisor, mobile launches standalone tracker

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` file
            - **Windows (x64):** `.msi` installer or `.exe` setup
            - **Windows (ARM64):** native `_arm64-setup.exe` setup (Windows 11 / Snapdragon)
            - **Linux (x64):** `.AppImage`, `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/openSUSE)
            - **iOS:** `.tar.gz` (from mobile build workflow)
            - **Android:** `.apk` (from mobile build workflow)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.desktop.conf.json${{ matrix.bundles && format(' --bundles {0}', matrix.bundles) || '' }}

  windows-arm64:
    needs: python-tests
    uses: ./.github/workflows/windows-arm64.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish-windows-arm64:
    needs: [build, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: AirWSJT-X-windows-arm64
          path: arm64-setup
      - name: Attach ARM64 setup to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" arm64-setup/*_arm64-setup.exe --clobber

  deploy-site:
    needs: [build, publish-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Substitute version in site template
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/__VERSION__/$VERSION/g" site/index.html

      - name: Deploy to Azure Static Website
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name AirWSJT-X/index.html \
            --file site/index.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --overwrite
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name AirWSJT-X \
            --file site/index.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --overwrite
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name Privacy/AirWSJT-X/index.html \
            --file site/privacy.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "public, max-age=3600" \
            --overwrite
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name Privacy/AirWSJT-X \
            --file site/privacy.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "public, max-age=3600" \
            --overwrite
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name Support/AirWSJT-X/index.html \
            --file site/support.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "public, max-age=3600" \
            --overwrite
          az storage blob upload \
            --account-name ad7npus \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name '$web' \
            --name Support/AirWSJT-X \
            --file site/support.html \
            --content-type "text/html; charset=utf-8" \
            --content-cache-control "public, max-age=3600" \
            --overwrite
