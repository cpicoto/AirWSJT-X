name: Mobile Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # iOS build requires Apple Developer signing credentials.
  # To enable: add APPLE_DEVELOPMENT_TEAM secret, uncomment this job.
  # ios:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
