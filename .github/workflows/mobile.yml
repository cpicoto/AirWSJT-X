name: Mobile Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also build a signed iOS app and upload it to TestFlight"
        type: boolean
        default: false
      macos_testflight:
        description: "Build a Mac App Store package and upload it to TestFlight"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Unsigned iOS Simulator build. This validates the full Rust/Tauri/Swift
  # toolchain compiles for iOS on every tagged release, without requiring
  # any Apple Developer signing credentials (simulator builds don't need
  # code signing).
  #
  # A signed on-device/TestFlight build is a follow-up: it additionally
  # needs a provisioning profile matching this app's bundle identifier
  # (us.ad7np.airwsjt-x), not just the APPLE_TEAM_ID used for macOS signing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          package_json = Path("package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")

          tauri_conf = Path("src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text(encoding="utf-8"))
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, replaced = re.subn(
              r'(?m)^version\s*=\s*"[^\"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("Failed to update src-tauri/Cargo.toml version")
          cargo_toml.write_text(cargo_text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run iOS packaging static tests
        run: python -m unittest tests.test_ios_packaging -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust stable with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Apply AirWSJT-X app icons
        run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build unsigned iOS Simulator app
        run: npx tauri ios build --debug --target aarch64-sim --no-sign --ci

      - name: Package iOS Simulator artifact
        run: |
          APP=$(find src-tauri/gen/apple -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found under src-tauri/gen/apple"
            exit 1
          fi
          # Unsigned simulator apps cannot use the Keychain (errSecMissingEntitlement),
          # which breaks credential storage. Ad-hoc signing fixes it.
          codesign --force --sign - "$APP"
          tar czf /tmp/AirWSJT-X-ios-simulator.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: /tmp/AirWSJT-X-ios-simulator.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/AirWSJT-X-ios-simulator.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TestFlight build. Manual only (workflow_dispatch with testflight=true) and
  # needs the secrets listed below; it fails fast with a clear message if any
  # are missing. Uses an App Store Connect API key for automatic provisioning,
  # so no provisioning profile has to be stored in the repo or secrets.
  #   IOS_CERTIFICATE            base64 .p12 of an *Apple Distribution* cert + key
  #   IOS_CERTIFICATE_PASSWORD   password for that .p12
  #   APPLE_TEAM_ID              10-char team id
  #   APPLE_API_KEY              App Store Connect API key id
  #   APPLE_API_ISSUER           App Store Connect issuer id
  #   APPLE_API_KEY_P8           contents of AuthKey_<id>.p8
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify TestFlight secrets
        env:
          HAVE_CERT: ${{ secrets.IOS_CERTIFICATE != '' }}
          HAVE_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD != '' }}
          HAVE_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAVE_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAVE_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAVE_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          for v in HAVE_CERT HAVE_PW HAVE_TEAM HAVE_KEY HAVE_ISSUER HAVE_P8; do
            if [ "${!v}" != "true" ]; then
              echo "::error::Missing TestFlight secret (${v#HAVE_}); see comment above the ios-testflight job"
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust stable with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Import signing certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Apply AirWSJT-X app icons
        run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build signed iOS app for TestFlight
        run: |
          npx tauri ios build --export-method app-store-connect --ci \
            -c "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"${{ github.run_number }}\"}}}"

      - name: Upload to TestFlight
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa produced"; exit 1; fi
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys

  # Mac App Store / TestFlight build (manual, macos_testflight=true).
  # Needs secrets: MAS_APP_CERTIFICATE(+_PASSWORD) = Apple Distribution .p12,
  # MAS_INSTALLER_CERTIFICATE(+_PASSWORD) = 3rd Party Mac Developer Installer
  # .p12, MAS_PROVISIONING_PROFILE = base64 Mac App Store .provisionprofile,
  # plus APPLE_TEAM_ID, APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8.
  macos-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_testflight
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: us.ad7np.airwsjt-x
    steps:
      - uses: actions/checkout@v7

      - name: Verify Mac App Store secrets
        env:
          HAVE_APP: ${{ secrets.MAS_APP_CERTIFICATE != '' && secrets.MAS_APP_CERTIFICATE_PASSWORD != '' }}
          HAVE_INSTALLER: ${{ secrets.MAS_INSTALLER_CERTIFICATE != '' && secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD != '' }}
          HAVE_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE != '' }}
          HAVE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          for v in HAVE_APP HAVE_INSTALLER HAVE_PROFILE HAVE_API; do
            if [ "${!v}" != "true" ]; then
              echo "::error::Missing Mac App Store secrets (${v#HAVE_}); see comment above the macos-testflight job"
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle Python sidecar with PyInstaller
        run: |
          pip install pyinstaller certifi
          pyinstaller --onefile --name airwsjtx_bridge --distpath src-tauri/binaries --paths . sidecar/airwsjtx_bridge.py
          mv src-tauri/binaries/airwsjtx_bridge "src-tauri/binaries/airwsjtx_bridge-$TARGET"
          chmod +x "src-tauri/binaries/airwsjtx_bridge-$TARGET"

      - name: Import signing certificates
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mas.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MAS_APP_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAS_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$MAS_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security find-identity -v "$KEYCHAIN"

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build unsigned app bundle
        run: |
          npx tauri build --target "$TARGET" --bundles app --ci \
            --config src-tauri/tauri.desktop.conf.json \
            -c '{"bundle":{"macOS":{"entitlements":null,"minimumSystemVersion":"12.0"}}}'

      - name: Verify bundle minimum macOS version
        run: |
          APP=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name "*.app" | head -1)
          lipo -info "$APP"/Contents/MacOS/*
          MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$MIN"
          if [ "${MIN%%.*}" -lt 12 ]; then
            echo "::error::LSMinimumSystemVersion must be >= 12.0 for arm64-only uploads (App Store Connect error 90869)"
            exit 1
          fi

      - name: Sign for Mac App Store and build installer package
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          APP=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          PLIST="$APP/Contents/Info.plist"

          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.utilities" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true

          ENT="$RUNNER_TEMP/app.entitlements"
          cp src-tauri/entitlements-mas.plist "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM_ID.$BUNDLE_ID" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENT"

          # Sandboxed helper binaries must inherit the parent sandbox.
          for BIN in "$APP"/Contents/MacOS/*; do
            if [ "$(basename "$BIN")" != "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")" ]; then
              codesign --force --timestamp --options runtime \
                --entitlements src-tauri/entitlements-mas-sidecar.plist \
                --sign "Apple Distribution" "$BIN"
            fi
          done
          codesign --force --timestamp --options runtime \
            --entitlements "$ENT" --sign "Apple Distribution" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          productbuild --component "$APP" /Applications \
            --sign "3rd Party Mac Developer Installer" "$RUNNER_TEMP/AirWSJT-X.pkg"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type macos -f "$RUNNER_TEMP/AirWSJT-X.pkg" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          package_json = Path("package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")

          tauri_conf = Path("src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text(encoding="utf-8"))
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, replaced = re.subn(
              r'(?m)^version\s*=\s*"[^\"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("Failed to update src-tauri/Cargo.toml version")
          cargo_toml.write_text(cargo_text, encoding="utf-8")
          PY

      # ── Pre-build: static packaging tests (no SDK/NDK required) ──────────
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Android packaging static tests
        run: python -m unittest tests.test_android_packaging -v

      # ── Toolchain setup ───────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Initialize Tauri Android
        run: npx tauri android init --skip-targets-install

      - name: Build Android ARM APK
        run: |
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          npx tauri android build --apk --target aarch64 --target armv7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture ARM APK
        id: capture_arm_apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No ARM release APK found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android -type f | head -20
            exit 1
          fi
          mkdir -p /tmp/android-unsigned
          cp "$APK" /tmp/android-unsigned/AirWSJT-X-android-arm-unsigned.apk
          echo "arm_apk_path=/tmp/android-unsigned/AirWSJT-X-android-arm-unsigned.apk" >> $GITHUB_OUTPUT

      - name: Build Android x86_64 APK
        run: |
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          npx tauri android build --apk --target x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture x86_64 APK
        id: capture_x86_64_apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No x86_64 release APK found under src-tauri/gen/android/app/build/outputs/apk"
            find src-tauri/gen/android -type f | head -20
            exit 1
          fi
          mkdir -p /tmp/android-unsigned
          cp "$APK" /tmp/android-unsigned/AirWSJT-X-android-x86_64-unsigned.apk
          echo "x86_64_apk_path=/tmp/android-unsigned/AirWSJT-X-android-x86_64-unsigned.apk" >> $GITHUB_OUTPUT

      # ── Align, sign, and validate APKs ───────────────────────────────────
      - name: Sign APK flavors
        id: find_apks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Every release must be signed with the same persistent key, otherwise
          # Android refuses to update an installed build ("signatures do not match").
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS repository secrets"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          mapfile -t APKS < <(printf '%s\n' \
            "${{ steps.capture_arm_apk.outputs.arm_apk_path }}" \
            "${{ steps.capture_x86_64_apk.outputs.x86_64_apk_path }}")

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"
          mkdir -p /tmp/android-signed
          : > /tmp/android-signed/apk-list.txt

          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            BASE="${NAME%-unsigned.apk}"
            ALIGNED="/tmp/${BASE}-aligned.apk"
            SIGNED="/tmp/android-signed/${BASE}.apk"

            "${BUILD_TOOLS}/zipalign" -f 4 "$APK" "$ALIGNED"

            "${BUILD_TOOLS}/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEYSTORE_PASSWORD \
              --out "$SIGNED" \
              "$ALIGNED"

            "${BUILD_TOOLS}/apksigner" verify "$SIGNED"
            echo "$SIGNED" >> /tmp/android-signed/apk-list.txt
            echo "APK found and signed: $APK -> $SIGNED"
          done

          rm -f "$KEYSTORE"
          echo "signed_apk_dir=/tmp/android-signed" >> $GITHUB_OUTPUT
          echo "signed_apk_list=/tmp/android-signed/apk-list.txt" >> $GITHUB_OUTPUT

      # ── Post-build APK validation ─────────────────────────────────────────
      - name: Validate APK flavors — manifest, version, signing, architectures
        run: |
          set -euo pipefail
          mapfile -t APKS < "${{ steps.find_apks.outputs.signed_apk_list }}"
          if [ "${#APKS[@]}" -lt 2 ]; then
            echo "Expected multiple APK flavors, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2"     | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign"  | sort -V | tail -1)
          echo "aapt2:     $AAPT2"
          echo "apksigner: $APKSIGNER"
          echo "zipalign:  $ZIPALIGN"

          PASS=0; FAIL=0
          : > /tmp/signer-certs.txt
          check() {
            local label="$1" result="$2"
            if [ "$result" = "ok" ]; then
              echo "  PASS  $label"; PASS=$((PASS+1))
            else
              echo "  FAIL  $label -- $result"; FAIL=$((FAIL+1))
            fi
          }

          EXPECTED_PKG=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['identifier'])")
          EXPECTED_VER=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            echo ""
            echo "Validating $NAME"
            BADGING=$("$AAPT2" dump badging "$APK")
            echo "$BADGING"

            ACTUAL_PKG=$(echo "$BADGING" | grep -oP "package: name='\K[^']+" || true)
            if [ "$ACTUAL_PKG" = "$EXPECTED_PKG" ]; then
              check "$NAME package name = $EXPECTED_PKG" ok
            else
              check "$NAME package name = $EXPECTED_PKG" "got '$ACTUAL_PKG'"
            fi

            VNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" || true)
            if [ -n "$VNAME" ]; then
              check "$NAME versionName present ($VNAME)" ok
            else
              check "$NAME versionName present" "missing or empty"
            fi

            if [ "$VNAME" = "$EXPECTED_VER" ]; then
              check "$NAME versionName matches tauri.conf.json ($EXPECTED_VER)" ok
            else
              check "$NAME versionName matches tauri.conf.json ($EXPECTED_VER)" "APK has '$VNAME'"
            fi

            VCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+" || true)
            if [ -n "$VCODE" ]; then
              check "$NAME versionCode present ($VCODE)" ok
            else
              check "$NAME versionCode present" "missing"
            fi

            MIN_SDK=$(echo "$BADGING" | grep -oP "minSdkVersion:'\K[0-9]+" || true)
            if [ -n "$MIN_SDK" ]; then
              check "$NAME minSdkVersion present ($MIN_SDK)" ok
            else
              check "$NAME minSdkVersion present" "missing"
            fi

            TGT_SDK=$(echo "$BADGING" | grep -oP "targetSdkVersion:'\K[0-9]+" || true)
            if [ -n "$TGT_SDK" ]; then
              check "$NAME targetSdkVersion present ($TGT_SDK)" ok
            else
              check "$NAME targetSdkVersion present" "missing"
            fi

            if "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/verify.txt 2>&1 && grep -Eq "Verified using v(2|3) scheme.*true" /tmp/verify.txt; then
              check "$NAME is signed (APK Signature Scheme v2/v3)" ok
            else
              cat /tmp/verify.txt
              check "$NAME is signed (APK Signature Scheme v2/v3)" "apksigner verify failed — APK is unsigned or has invalid signature"
            fi

            if grep -q "CN=Android Debug" /tmp/verify.txt; then
              check "$NAME is signed with the release key" "signed with a throwaway debug certificate"
            else
              check "$NAME is signed with the release key" ok
            fi

            CERT=$(grep -oP "certificate SHA-256 digest: \K[0-9a-f]+" /tmp/verify.txt | head -1 || true)
            echo "$CERT" >> /tmp/signer-certs.txt

            if "$ZIPALIGN" -c -v 4 "$APK" > /dev/null 2>&1; then
              check "$NAME is zip-aligned (4-byte)" ok
            else
              check "$NAME is zip-aligned (4-byte)" "zipalign check failed"
            fi

            case "$NAME" in
              *arm*)
                if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
                  check "$NAME arm64-v8a native library present" ok
                else
                  check "$NAME arm64-v8a native library present" "missing"
                fi
                if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
                  check "$NAME armeabi-v7a native library present" ok
                else
                  check "$NAME armeabi-v7a native library present" "missing"
                fi
                ;;
              *x86_64*)
                if unzip -l "$APK" | grep -q "lib/x86_64/"; then
                  check "$NAME x86_64 native library present" ok
                else
                  check "$NAME x86_64 native library present" "missing"
                fi
                ;;
            esac

            SIZE=$(stat -c%s "$APK")
            if [ "$SIZE" -ge 100000 ]; then
              check "$NAME size >= 100 KB ($SIZE bytes)" ok
            else
              check "$NAME size >= 100 KB" "only $SIZE bytes — possible empty/corrupt build"
            fi
          done

          echo ""
          UNIQUE_CERTS=$(sort -u /tmp/signer-certs.txt | grep -c . || true)
          if [ "$UNIQUE_CERTS" -eq 1 ]; then
            check "all APK flavors share one signing certificate" ok
          else
            check "all APK flavors share one signing certificate" "found $UNIQUE_CERTS distinct certificates"
          fi
          echo "Signing certificate SHA-256: $(sort -u /tmp/signer-certs.txt | head -1)"

          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── Artifacts & release ───────────────────────────────────────────────
      - name: Upload Android artifact
        if: always() && steps.find_apks.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: ${{ steps.find_apks.outputs.signed_apk_dir }}/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.find_apks.outputs.signed_apk_dir }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
