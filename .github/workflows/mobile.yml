  #       with:
  #         targets: aarch64-apple-ios
  #     - run: npm ci
  #     - run: npx tauri ios init
  #     - name: Build iOS
  #       run: npx tauri ios build --export-method debugging
  #       env:
  #         APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
  #     - name: Package iOS artifacts
  #       run: find src-tauri/gen/apple -name "*.app" -type d | head -1 | xargs -I{} tar czf /tmp/AirWSJT-X-ios.tar.gz {}
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: ios-build
  #         path: /tmp/AirWSJT-X-ios.tar.gz
  #     - uses: softprops/action-gh-release@v2
  #       if: startsWith(github.ref, 'refs/tags/v')
  #       with:
  #         files: /tmp/AirWSJT-X-ios.tar.gz
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          package_json = Path("package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")

          tauri_conf = Path("src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text(encoding="utf-8"))
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n", encoding="utf-8")

          cargo_toml = Path("src-tauri/Cargo.toml")
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, replaced = re.subn(
              r'(?m)^version\s*=\s*"[^\"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("Failed to update src-tauri/Cargo.toml version")
          cargo_toml.write_text(cargo_text, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build --apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          cp "$APK" /tmp/AirWSJT-X-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: /tmp/AirWSJT-X-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/AirWSJT-X-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
