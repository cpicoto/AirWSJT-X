name: macOS TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          for p in ["package.json", "src-tauri/tauri.conf.json"]:
              f = Path(p)
              d = json.loads(f.read_text())
              d["version"] = version
              f.write_text(json.dumps(d, indent=2) + "\n")

          cargo = Path("src-tauri/Cargo.toml")
          text, n = re.subn(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{version}"', cargo.read_text(), count=1)
          if n != 1: raise SystemExit("Cargo.toml version update failed")
          cargo.write_text(text)
          PY


      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Import signing certificates
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          APP_CERT=$RUNNER_TEMP/app.p12
          INSTALLER_CERT=$RUNNER_TEMP/installer.p12
          KEYCHAIN=$RUNNER_TEMP/mas-signing.keychain-db
          KC_PASS=$(openssl rand -hex 12)

          echo -n "$MAS_APP_CERTIFICATE" | base64 --decode -o "$APP_CERT"
          echo -n "$MAS_INSTALLER_CERTIFICATE" | base64 --decode -o "$INSTALLER_CERT"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"

          security import "$APP_CERT" -P "$MAS_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "=== Installer identities ==="
          security find-identity -v "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$MAS_PROVISIONING_PROFILE" | base64 --decode -o "$PROFILE_DIR/AirWSJTX_Profile.provisionprofile"
          ls -la "$PROFILE_DIR"

      - name: Bundle Python sidecar with PyInstaller
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Apple Distribution signing identity is required before packaging Python libraries"
            exit 1
          fi
          pip install pyinstaller certifi
          # Onefile libraries must be signed before compression; signing the outer executable cannot repair them.
          pyinstaller --onefile --codesign-identity "$IDENTITY" --name airwsjtx_bridge --distpath src-tauri/binaries --paths . sidecar/airwsjtx_bridge.py
          mv src-tauri/binaries/airwsjtx_bridge src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin
          chmod +x src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin

      - name: Smoke test hardened Python sidecar
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          # Before adding sandbox-inheritance entitlements, test library validation
          # directly. The CI shell cannot launch an inherit-only sandbox helper.
          with tempfile.TemporaryDirectory() as home:
              result = subprocess.run(
                  ["src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin"],
                  input=json.dumps({"id": "packaging-smoke", "method": "get_status"}) + "\n",
                  capture_output=True,
                  text=True,
                  timeout=30,
                  env={**os.environ, "HOME": home},
              )
              if result.returncode:
                  raise SystemExit(f"Packaged sidecar failed to start: {result.stderr}")
              replies = [json.loads(line) for line in result.stdout.splitlines()]
              reply = next((item for item in replies if item.get("id") == "packaging-smoke"), None)
              if not reply or not reply.get("ok"):
                  raise SystemExit(f"Packaged sidecar did not answer get_status: {result.stderr}")
          PY

      - name: Sign sidecar with MAS entitlements
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing sidecar with: $IDENTITY"
          codesign --force --options runtime \
            --entitlements src-tauri/entitlements-mas-sidecar.plist \
            --sign "$IDENTITY" \
            src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin
          codesign -dv --verbose=2 src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin

      - name: Build Tauri .app for Mac App Store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APPLE_SIGNING_IDENTITY="$IDENTITY" npx tauri build \
            --target aarch64-apple-darwin \
            --bundles app \
            --config src-tauri/tauri.desktop.conf.json \
            --config src-tauri/tauri.mas.conf.json

      - name: Re-sign .app bundle for MAS
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          echo "Re-signing $APP_PATH with $IDENTITY"

          # Patch CFBundleIdentifier to match the provisioning profile
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier us.ad7np.airwsjt-x" "$APP_PATH/Contents/Info.plist"
          # Set unique build number so Apple accepts each upload
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Contents/Info.plist"
          # Set minimum system version for arm64-only
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 12.0" "$APP_PATH/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 12.0" "$APP_PATH/Contents/Info.plist"
          # Set app category required by App Store
          /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType public.app-category.utilities" "$APP_PATH/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.utilities" "$APP_PATH/Contents/Info.plist"
          # Skip export compliance dialog on each TestFlight upload (app uses only HTTPS)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true

          echo "=== Info.plist key values ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$APP_PATH/Contents/Info.plist"

          # Embed provisioning profile
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/AirWSJTX_Profile.provisionprofile" "$APP_PATH/Contents/embedded.provisionprofile"

          # Deep-sign all nested code first, then the outer .app
          find "$APP_PATH/Contents/MacOS" -type f -perm +111 ! -name "AirWSJT-X" | while read bin; do
            codesign --force --options runtime \
              --entitlements src-tauri/entitlements-mas-sidecar.plist \
              --sign "$IDENTITY" "$bin"
          done

          find "$APP_PATH" -name "*.dylib" -o -name "*.framework" | while read lib; do
            codesign --force --options runtime \
              --sign "$IDENTITY" "$lib"
          done

          codesign --force --options runtime \
            --entitlements src-tauri/entitlements-mas.plist \
            --sign "$IDENTITY" \
            "$APP_PATH"

          echo "=== Verify signature ==="
          codesign -dv --verbose=2 "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Build .pkg installer
        run: |
          INSTALLER_IDENTITY=$(security find-identity -v "$RUNNER_TEMP/mas-signing.keychain-db" | grep "3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          PKG_PATH=$RUNNER_TEMP/AirWSJT-X.pkg

          echo "Building .pkg with installer identity: $INSTALLER_IDENTITY"
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_PATH"

          echo "=== Verify .pkg ==="
          pkgutil --check-signature "$PKG_PATH"
          ls -lh "$PKG_PATH"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          API_KEY_DIR="$HOME/private_keys"
          mkdir -p "$API_KEY_DIR"
          KEY_FILE="$API_KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"

          # The secret may be base64-encoded or raw PEM — detect and handle both
          if printf '%s' "$APPLE_API_KEY_P8" | head -c 30 | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_FILE"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          fi

          echo "=== Verify API key ==="
          head -1 "$KEY_FILE"
          wc -c "$KEY_FILE"

          PKG_PATH=$RUNNER_TEMP/AirWSJT-X.pkg

          echo "Uploading $PKG_PATH to TestFlight..."
          xcrun altool --upload-app \
            --type osx \
            --file "$PKG_PATH" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER" \
            --private-key-dir "$API_KEY_DIR"

      - name: Upload .pkg as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-testflight-pkg
          path: ${{ runner.temp }}/AirWSJT-X.pkg
          if-no-files-found: ignore
