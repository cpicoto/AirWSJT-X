name: macOS TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync app versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"]
          version = tag[1:] if tag.startswith("v") else tag

          for p in ["package.json", "src-tauri/tauri.conf.json"]:
              f = Path(p)
              d = json.loads(f.read_text())
              d["version"] = version
              f.write_text(json.dumps(d, indent=2) + "\n")

          cargo = Path("src-tauri/Cargo.toml")
          text, n = re.subn(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{version}"', cargo.read_text(), count=1)
          if n != 1: raise SystemExit("Cargo.toml version update failed")
          cargo.write_text(text)
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle Python sidecar with PyInstaller
        run: |
          pip install pyinstaller certifi
          pyinstaller --onefile --name airwsjtx_bridge --distpath src-tauri/binaries --paths . sidecar/airwsjtx_bridge.py
          mv src-tauri/binaries/airwsjtx_bridge src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin
          chmod +x src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin

      - name: Import signing certificates
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          APP_CERT=$RUNNER_TEMP/app.p12
          INSTALLER_CERT=$RUNNER_TEMP/installer.p12
          KEYCHAIN=$RUNNER_TEMP/mas-signing.keychain-db
          KC_PASS=$(openssl rand -hex 12)

          echo -n "$MAS_APP_CERTIFICATE" | base64 --decode -o "$APP_CERT"
          echo -n "$MAS_INSTALLER_CERTIFICATE" | base64 --decode -o "$INSTALLER_CERT"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"

          security import "$APP_CERT" -P "$MAS_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "=== Installer identities ==="
          security find-identity -v "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$MAS_PROVISIONING_PROFILE" | base64 --decode -o "$PROFILE_DIR/AirWSJTX_Profile.provisionprofile"
          ls -la "$PROFILE_DIR"

      - name: Sign sidecar with MAS entitlements
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing sidecar with: $IDENTITY"
          codesign --force --options runtime \
            --entitlements src-tauri/entitlements-mas.plist \
            --sign "$IDENTITY" \
            src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin
          codesign -dv --verbose=2 src-tauri/binaries/airwsjtx_bridge-aarch64-apple-darwin

      - name: Build Tauri .app for Mac App Store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APPLE_SIGNING_IDENTITY="$IDENTITY" npx tauri build \
            --target aarch64-apple-darwin \
            --bundles app \
            --config src-tauri/tauri.desktop.conf.json \
            --config src-tauri/tauri.mas.conf.json

      - name: Re-sign .app bundle for MAS
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/mas-signing.keychain-db" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          echo "Re-signing $APP_PATH with $IDENTITY"

          # Embed provisioning profile
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/AirWSJTX_Profile.provisionprofile" "$APP_PATH/Contents/embedded.provisionprofile"

          # Deep-sign all nested code first, then the outer .app
          find "$APP_PATH/Contents/MacOS" -type f -perm +111 ! -name "AirWSJT-X" | while read bin; do
            codesign --force --options runtime \
              --entitlements src-tauri/entitlements-mas.plist \
              --sign "$IDENTITY" "$bin"
          done

          find "$APP_PATH" -name "*.dylib" -o -name "*.framework" | while read lib; do
            codesign --force --options runtime \
              --sign "$IDENTITY" "$lib"
          done

          codesign --force --options runtime \
            --entitlements src-tauri/entitlements-mas.plist \
            --sign "$IDENTITY" \
            "$APP_PATH"

          echo "=== Verify signature ==="
          codesign -dv --verbose=2 "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Build .pkg installer
        run: |
          INSTALLER_IDENTITY=$(security find-identity -v "$RUNNER_TEMP/mas-signing.keychain-db" | grep "3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          PKG_PATH=$RUNNER_TEMP/AirWSJT-X.pkg

          echo "Building .pkg with installer identity: $INSTALLER_IDENTITY"
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_PATH"

          echo "=== Verify .pkg ==="
          pkgutil --check-signature "$PKG_PATH"
          ls -lh "$PKG_PATH"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Write the API key for altool/notarytool
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$API_KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"

          PKG_PATH=$RUNNER_TEMP/AirWSJT-X.pkg

          echo "Uploading $PKG_PATH to TestFlight..."
          xcrun altool --upload-app \
            --type osx \
            --file "$PKG_PATH" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload .pkg as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-testflight-pkg
          path: ${{ runner.temp }}/AirWSJT-X.pkg
          if-no-files-found: ignore
