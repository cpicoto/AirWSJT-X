name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: python-tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

      - name: Build Windows sidecar
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller certifi
          python -m PyInstaller --noconfirm --clean --distpath src-tauri/binaries sidecar/airwsjtx_bridge.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item src-tauri\binaries\airwsjtx_bridge\airwsjtx_bridge.exe src-tauri\binaries\airwsjtx_bridge.exe
          Move-Item src-tauri\binaries\airwsjtx_bridge\airwsjtx_bridge-runtime src-tauri\binaries\airwsjtx_bridge-runtime

      - name: Verify packaged Windows sidecar
        if: runner.os == 'Windows'
        env:
          AIRWSJTX_PACKAGED_SIDECAR: src-tauri/binaries/airwsjtx_bridge.exe
        run: python -m unittest tests.test_sidecar_packaging -v

  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit

  android-packaging-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Android packaging static tests
        run: python -m unittest tests.test_android_packaging -v

  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Rust tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies (Tauri 2 / WebKit2GTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  playwright-ui-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Playwright UI tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Create screenshots directory
        run: python -c "from pathlib import Path; Path('screenshots').mkdir(parents=True, exist_ok=True)"

      - name: Run Playwright tests
        run: npx playwright test --config playwright.config.ts --reporter=list

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: ignore
